<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA - Aplicación de Redes Neuronales | UCSG TEC</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="container header-content">
            <div class="brand-section">
                <img src="resource/logo.png" alt="Logo UCSG TEC" class="logo">
                <div class="header-text">
                    <h1>Aplicación de Redes Neuronales</h1>
                    <p>Carrera de Inteligencia Artificial | Ciclo A2026</p>
                    <span class="teacher">Docente: Ing. Adriana Larrea, Mgs.</span>
                </div>
            </div>

            <div class="header-links">
                <a href="https://tec.ucsg.edu.ec/" target="_blank" class="nav-item">
                    <i class="fas fa-laptop-code"></i>
                    <strong>Plataforma Virtual</strong>
                </a>
                <a href="https://www.ucsg.edu.ec/ucsg-online/" target="_blank" class="nav-item">
                    <i class="fas fa-university"></i>
                    <strong>Servicios en Línea</strong>
                </a>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>FECHA</th>
                        <th>SESIÓN</th>
                        <th>TÍTULO DE LA CLASE</th>
                        <th>GUÍA</th>
                        <th>CÓDIGO</th>
                        <th>VIDEO</th>
                        <th>RECURSO</th>
                    </tr>
                </thead>
                <tbody id="tabla-temas">
                    </tbody>
            </table>
        </div>
    </main>

    <script>
        async function inicializar() {
            try {
                const response = await fetch('temas.md');
                if (!response.ok) throw new Error("No se pudo cargar temas.md");
                const texto = await response.text();
                const temas = extraerDatos(texto);
                dibujarTabla(temas);
            } catch (error) {
                document.getElementById('tabla-temas').innerHTML = `<tr><td colspan="7" style="text-align:center; padding:20px; color:red;">Error: ${error.message}</td></tr>`;
            }
        }

        function extraerDatos(texto) {
            const lineas = texto.split('\n');
            const lista = [];
            let temaTemp = null;

            // Nombres exactos de las carpetas según tu estructura
            const carpetas = [
                "Tema_01_Conceptos_Basicos", "Tema_02_Componentes_ANN", 
                "Tema_03_Entrenamiento_Basico", "Tema_04_Herramientas_Entornos",
                "Tema_05_Clasificacion_MLP", "Tema_06_Regresion_MLP", 
                "Tema_07_Evaluacion_Modelos", "Tema_08_Mejora_Practica"
            ];

            const mesesMap = { "Jan": 0, "Feb": 1, "Mar": 2, "Apr": 3, "May": 4, "Jun": 5 };

            lineas.forEach(linea => {
                const limpio = linea.trim();
                
                // Detectar Título: Busca "Tema X:"
                if (limpio.toLowerCase().includes("tema") && limpio.includes(":")) {
                    const partes = limpio.split(':');
                    temaTemp = { titulo: partes[1].trim() };
                }

                // Detectar Fecha: Busca formato "DD Mes" (Ej: 19 Mar)
                const regexFecha = /(\d{2})\s(Jan|Feb|Mar|Apr|May|Jun)/i;
                const match = limpio.match(regexFecha);

                if (match && temaTemp) {
                    temaTemp.fechaStr = match[0];
                    // Crear objeto fecha para comparar (Año 2026 fijo)
                    temaTemp.fechaObj = new Date(2026, mesesMap[match[2]], parseInt(match[1]));
                    lista.push(temaTemp);
                    temaTemp = null; // Reiniciar para el siguiente tema
                }
            });
            
            // Asignar carpetas por índice
            return lista.map((t, i) => ({ ...t, folder: carpetas[i] }));
        }

        function dibujarTabla(temas) {
            const hoy = new Date();
            const tabla = document.getElementById('tabla-temas');
            tabla.innerHTML = ""; 

            temas.forEach((t, i) => {
                const esVisible = hoy >= t.fechaObj;
                const fila = document.createElement('tr');
                if (!esVisible) fila.classList.add('bloqueado');

                fila.innerHTML = `
                    <td>${t.fechaStr}</td>
                    <td>Tema ${i + 1}</td>
                    <td>${t.titulo}</td>
                    <td>${esVisible ? `<a href="./${t.folder}/readme.md" class="link-text">Ver Guía</a>` : 'Próximamente'}</td>
                    <td>${esVisible ? `<a href="./${t.folder}/ANN_Practica.txt" target="_blank" class="link-code"><i class="fas fa-code"></i> Código</a>` : '-'}</td>
                    <td>${esVisible ? `<a href="#" onclick="abrirVideo('./${t.folder}/grabacion_clase.url')" class="link-video"><i class="fas fa-video"></i> Video</a>` : '-'}</td>
                    <td>${esVisible ? `<a href="#" onclick="abrirImagen('./${t.folder}/image1.png')" class="link-text">Ver recurso</a>` : '-'}</td>
                `;
                tabla.appendChild(fila);
            });
        }

        function abrirVideo(path) {
            fetch(path).then(r => r.text()).then(t => {
                const match = t.match(/URL=(.+)/);
                if (match) window.open(match[1].trim(), '_blank');
            }).catch(() => alert("Enlace no disponible."));
        }

        function abrirImagen(path) {
            window.open(path, '_blank');
        }

        window.onload = inicializar;
    </script>
</body>
</html>
