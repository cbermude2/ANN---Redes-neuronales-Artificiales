<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA - Aplicación de Redes Neuronales | UCSG TEC</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="container header-content">
            <div class="brand-section">
                <img src="resource/logo.png" alt="Logo UCSG TEC" class="logo">
                <div class="header-text">
                    <h1>Aplicación de Redes Neuronales</h1>
                    <p>Carrera de Inteligencia Artificial | Ciclo A2026</p>
                    <span class="teacher">Docente: Ing. Adriana Larrea, Mgs.</span>
                </div>
            </div>
            <div class="header-links">
                <a href="https://tec.ucsg.edu.ec/" target="_blank" class="nav-item">
                    <i class="fas fa-laptop-code"></i><strong>Plataforma Virtual</strong>
                </a>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="table-container">
            <table id="main-table">
                <thead>
                    <tr>
                        <th>FECHA</th>
                        <th>SESIÓN</th>
                        <th>TÍTULO DE LA CLASE</th>
                        <th>GUÍA</th>
                        <th>CÓDIGO</th>
                        <th>VIDEO</th>
                        <th>RECURSO</th>
                    </tr>
                </thead>
                <tbody id="tabla-cuerpo">
                    </tbody>
            </table>
        </div>
    </main>

    <script>
        async function cargarTemasDesdeMD() {
            try {
                const response = await fetch('temas.md');
                const texto = await response.text();
                const lineas = texto.split('\n');
                
                const temasProcesados = [];
                let temaActual = null;

                // Expresión regular para capturar "Guía X - Tema X: Título" y la fecha
                lineas.forEach(linea => {
                    if (linea.includes("Guía") && linea.includes("Tema")) {
                        const partes = linea.split(':');
                        temaActual = { titulo: partes[1]?.trim() || "Sin título", fecha: "" };
                    }
                    if (linea.includes("19 Mar") || linea.includes("26 Mar") || linea.includes("02 Abr") || 
                        linea.includes("09 Abr") || linea.includes("16 Abr") || linea.includes("23 Abr") || 
                        linea.includes("30 Abr") || linea.includes("07 May")) {
                        // Extraemos la fecha (asumiendo formato DD Mes)
                        const matchFecha = linea.match(/(\d{2}\s\w{3})/);
                        if (matchFecha && temaActual) {
                            temaActual.fechaString = matchFecha[0];
                            // Convertimos a objeto Date para la lógica de hoy (Año 2026 fijo)
                            temaActual.fechaObj = normalizarFecha(matchFecha[0]);
                            temasProcesados.push({...temaActual});
                            temaActual = null;
                        }
                    }
                });

                renderizarTabla(temasProcesados);
            } catch (error) {
                console.error("Error al cargar temas.md:", error);
            }
        }

        function normalizarFecha(fStr) {
            const meses = { "Mar": 2, "Abr": 3, "May": 4 }; // Enero es 0
            const [dia, mes] = fStr.split(' ');
            return new Date(2026, meses[mes], parseInt(dia));
        }

        function renderizarTabla(lista) {
            const hoy = new Date();
            const cuerpo = document.getElementById('tabla-cuerpo');
            cuerpo.innerHTML = ""; // Limpiar mensaje de carga

            lista.forEach((t, index) => {
                const num = (index + 1).toString().padStart(2, '0');
                const carpeta = `Tema_${num}_${t.titulo.replace(/\s+/g, '_').substring(0, 15)}`;
                const esVisible = hoy >= t.fechaObj;
                
                const fila = document.createElement('tr');
                if (!esVisible) fila.classList.add('bloqueado');

                fila.innerHTML = `
                    <td>${t.fechaString}</td>
                    <td>Tema ${index + 1}</td>
                    <td>${t.titulo}</td>
                    <td>${esVisible ? `<a href="./${carpeta}/readme.md" class="link-text">Ver Guía</a>` : 'Próximamente'}</td>
                    <td>${esVisible ? `<a href="./${carpeta}/ANN_Practica.txt" target="_blank" class="link-code"><i class="fas fa-code"></i> Código</a>` : '-'}</td>
                    <td>${esVisible ? `<a href="#" onclick="abrirVideo('./${carpeta}/grabacion_clase.url')" class="link-video"><i class="fas fa-video"></i> Video</a>` : '-'}</td>
                    <td>${esVisible ? `<a href="#" onclick="verificarRecurso('./${carpeta}/image1.png')" class="link-text">Ver recurso</a>` : '-'}</td>
                `;
                cuerpo.appendChild(fila);
            });
        }

        // Las funciones abrirVideo y verificarRecurso se mantienen igual...
        function abrirVideo(path) {
            fetch(path).then(r => r.text()).then(t => {
                const url = t.match(/URL=(.+)/);
                if (url) window.open(url[1].trim(), '_blank');
            }).catch(() => alert("Video no disponible"));
        }

        function verificarRecurso(path) {
            const img = new Image();
            img.onload = () => window.open(path, '_blank');
            img.onerror = () => alert("No hay recurso extra.");
            img.src = path;
        }

        window.onload = cargarTemasDesdeMD;
    </script>
</body>
</html>
