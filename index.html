<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA - Aplicación de Redes Neuronales | UCSG TEC</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="container header-content">
            <div class="brand-section">
                <img src="resource/logo.png" alt="Logo UCSG TEC" class="logo">
                <div class="header-text">
                    <h1>Aplicación de Redes Neuronales</h1>
                    <p>Carrera de Inteligencia Artificial | Ciclo A2026</p>
                    <span class="teacher">Docente: Ing. Christian Bermpudez, Mgs.</span>
                </div>
            </div>

            <div class="header-links">
                <a href="https://tec.ucsg.edu.ec/" target="_blank" class="nav-item">
                    <i class="fas fa-laptop-code"></i>
                    <strong>Plataforma Virtual</strong>
                </a>
                <a href="https://www.ucsg.edu.ec/ucsg-online/" target="_blank" class="nav-item">
                    <i class="fas fa-university"></i>
                    <strong>Servicios en Línea</strong>
                </a>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>FECHA</th>
                        <th>SESIÓN</th>
                        <th>TÍTULO DE LA CLASE</th>
                        <th>GUÍA</th>
                        <th>CÓDIGO</th>
                        <th>VIDEO</th>
                        <th>RESULTADO</th>
                    </tr>
                </thead>
                <tbody id="tabla-temas">
                    </tbody>
            </table>
        </div>
    </main>

    <script>
        async function inicializar() {
            try {
                // Forzamos la lectura de temas.txt (ajustado según tu archivo subido)
                const response = await fetch('temas.txt');
                const texto = await response.text();
                const temas = procesarInformacion(texto);
                dibujarTabla(temas);
            } catch (error) {
                console.error("Error cargando el archivo:", error);
            }
        }

        function procesarInformacion(texto) {
            const lineas = texto.split('\n');
            const listaTemas = [];
            
            // Definición manual de los 8 temas y sus carpetas según tu estructura
            const configTemas = [
                { id: 1, folder: "Tema_01_Conceptos_Basicos", titulo: "De la neurona artificial a la decisión", fecha: new Date(2026, 2, 19), fechaStr: "19 Mar" },
                { id: 2, folder: "Tema_02_Componentes_ANN", titulo: "Capas, pesos, sesgos y forward pass", fecha: new Date(2026, 2, 26), fechaStr: "26 Mar" },
                { id: 3, folder: "Tema_03_Entrenamiento_Basico", titulo: "Entrenar sin magia: particiones y épocas", fecha: new Date(2026, 3, 2), fechaStr: "02 Abr" },
                { id: 4, folder: "Tema_04_Herramientas_Entornos", titulo: "Elegir herramienta y armar un pipeline", fecha: new Date(2026, 3, 9), fechaStr: "09 Abr" },
                { id: 5, folder: "Tema_05_Clasificacion_MLP", titulo: "Clasificación binaria/multiclase", fecha: new Date(2026, 3, 16), fechaStr: "16 Abr" },
                { id: 6, folder: "Tema_06_Regresion_MLP", titulo: "Regresión con MLP: MAE y MSE", fecha: new Date(2026, 3, 23), fechaStr: "23 Abr" },
                { id: 7, folder: "Tema_07_Evaluacion_Modelos", titulo: "Métricas que sí sirven", fecha: new Date(2026, 3, 30), fechaStr: "30 Abr" },
                { id: 8, folder: "Tema_08_Mejora_Practica", titulo: "Mejorar sin complicarse: Hiperparámetros", fecha: new Date(2026, 4, 7), fechaStr: "07 May" }
            ];

            return configTemas;
        }

        function dibujarTabla(temas) {
            const hoy = new Date();
            const tabla = document.getElementById('tabla-temas');
            tabla.innerHTML = "";

            temas.forEach(t => {
                const esActivo = hoy >= t.fecha;
                const fila = document.createElement('tr');
                if (!esActivo) fila.className = 'bloqueado';

                fila.innerHTML = `
                    <td>${t.fechaStr}</td>
                    <td>Tema ${t.id}</td>
                    <td>${t.titulo}</td>
                    <td>${esActivo ? `<a href="./${t.folder}/readme.md" class="link-text">Ver Guía</a>` : 'Próximamente'}</td>
                    <td>${esActivo ? `<a href="./${t.folder}/ANN_Practica.txt" class="link-code"><i class="fas fa-code"></i> Código</a>` : '-'}</td>
                    <td>${esActivo ? `<a href="#" onclick="abrirURL('./${t.folder}/grabacion_clase.url')" class="link-video"><i class="fas fa-video"></i> Video</a>` : '-'}</td>
                    <td>${esActivo ? `<a href="./${t.folder}/image1.png" target="_blank" class="link-text">Ver resultado</a>` : '-'}</td>
                `;
                tabla.appendChild(fila);
            });
        }

        function abrirURL(ruta) {
            fetch(ruta).then(r => r.text()).then(t => {
                const m = t.match(/URL=(.+)/);
                if (m) window.open(m[1].trim(), '_blank');
            }).catch(() => alert("El video aún no ha sido cargado."));
        }

        window.onload = inicializar;
    </script>
</body>
</html>
