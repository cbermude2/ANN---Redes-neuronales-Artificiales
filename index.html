<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA - Aplicación de Redes Neuronales | UCSG TEC</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="container header-content">
            <div class="brand-section">
                <img src="resource/logo.png" alt="Logo UCSG TEC" class="logo">
                <div class="header-text">
                    <h1>Aplicación de Redes Neuronales</h1>
                    <p>Carrera de Inteligencia Artificial | Ciclo A2026</p>
                    <span class="teacher">Docente: Ing. Adriana Larrea, Mgs.</span>
                </div>
            </div>

            <div class="header-links">
                <a href="https://tec.ucsg.edu.ec/" target="_blank" class="nav-item">
                    <i class="fas fa-laptop-code"></i>
                    <strong>Plataforma Virtual</strong>
                </a>
                <a href="https://www.ucsg.edu.ec/ucsg-online/" target="_blank" class="nav-item">
                    <i class="fas fa-university"></i>
                    <strong>Servicios en Línea</strong>
                </a>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>FECHA</th>
                        <th>SESIÓN</th>
                        <th>TÍTULO DE LA CLASE</th>
                        <th>GUÍA</th>
                        <th>CÓDIGO</th>
                        <th>VIDEO</th>
                        <th>RECURSO</th>
                    </tr>
                </thead>
                <tbody id="tabla-temas">
                    </tbody>
            </table>
        </div>
    </main>

    <script>
        async function cargarContenido() {
            try {
                const response = await fetch('temas.md');
                const texto = await response.text();
                const temas = procesarMD(texto);
                renderizar(temas);
            } catch (e) {
                console.error("Error cargando temas.md", e);
            }
        }

        function procesarMD(texto) {
            const lineas = texto.split('\n');
            const lista = [];
            let item = null;

            // Mapeo de meses para comparar con la fecha actual
            const mesesMap = { "Mar": 2, "Abr": 3, "May": 4, "Jun": 5 };

            lineas.forEach(linea => {
                const l = linea.trim();
                
                // 1. Detectar Guía y Tema (Título)
                if (l.toLowerCase().includes("guía") && l.includes(":")) {
                    const partes = l.split(':');
                    item = { titulo: partes[1].trim(), fechaStr: "", fechaObj: null };
                }

                // 2. Detectar Fecha (Ej: 19 Mar)
                const regexFecha = /(\d{2})\s(Mar|Abr|May|Jun)/i;
                const match = l.match(regexFecha);

                if (match && item) {
                    item.fechaStr = match[0];
                    // Crear objeto fecha para 2026
                    item.fechaObj = new Date(2026, mesesMap[match[2]], parseInt(match[1]));
                    lista.push({...item});
                    item = null;
                }
            });
            return lista;
        }

        function renderizar(temas) {
            const hoy = new Date();
            const tbody = document.getElementById('tabla-temas');
            
            // Nombres de carpetas según estructura física
            const folders = [
                "Tema_01_Conceptos_Basicos", "Tema_02_Componentes_ANN", 
                "Tema_03_Entrenamiento_Basico", "Tema_04_Herramientas_Entornos",
                "Tema_05_Clasificacion_MLP", "Tema_06_Regresion_MLP",
                "Tema_07_Evaluacion_Modelos", "Tema_08_Mejora_Practica"
            ];

            tbody.innerHTML = "";
            temas.forEach((t, i) => {
                const folder = folders[i] || `Tema_0${i+1}`;
                const habilitado = hoy >= t.fechaObj;
                const tr = document.createElement('tr');
                
                if (!habilitado) tr.classList.add('bloqueado');

                tr.innerHTML = `
                    <td>${t.fechaStr}</td>
                    <td>Tema ${i + 1}</td>
                    <td>${t.titulo}</td>
                    <td>${habilitado ? `<a href="./${folder}/readme.md" class="link-text">Ver Guía</a>` : 'Próximamente'}</td>
                    <td>${habilitado ? `<a href="./${folder}/ANN_Practica.txt" target="_blank" class="link-code"><i class="fas fa-code"></i> Código</a>` : '-'}</td>
                    <td>${habilitado ? `<a href="#" onclick="verVideo('./${folder}/grabacion_clase.url')" class="link-video"><i class="fas fa-video"></i> Video</a>` : '-'}</td>
                    <td>${habilitado ? `<a href="#" onclick="verImagen('./${folder}/image1.png')" class="link-text">Ver recurso</a>` : '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function verVideo(path) {
            fetch(path).then(r => r.text()).then(t => {
                const url = t.match(/URL=(.+)/);
                if (url) window.open(url[1].trim(), '_blank');
            }).catch(() => alert("No disponible"));
        }

        function verImagen(path) {
            window.open(path, '_blank');
        }

        window.onload = cargarContenido;
    </script>
</body>
</html>
