<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA - Aplicación de Redes Neuronales | UCSG TEC</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="container header-content">
            <div class="brand-section">
                <img src="resource/logo.png" alt="Logo UCSG TEC" class="logo">
                <div class="header-text">
                    <h1>Aplicación de Redes Neuronales</h1>
                    <p>Carrera de Inteligencia Artificial | Ciclo A2026</p>
                    <span class="teacher">Docente: Ing. Adriana Larrea, Mgs.</span>
                </div>
            </div>

            <div class="header-links">
                <a href="https://tec.ucsg.edu.ec/" target="_blank" class="nav-item">
                    <i class="fas fa-laptop-code"></i>
                    <strong>Plataforma Virtual</strong>
                </a>
                <a href="https://www.ucsg.edu.ec/ucsg-online/" target="_blank" class="nav-item">
                    <i class="fas fa-university"></i>
                    <strong>Servicios en Línea</strong>
                </a>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>FECHA</th>
                        <th>SESIÓN</th>
                        <th>TÍTULO DE LA CLASE</th>
                        <th>GUÍA</th>
                        <th>CÓDIGO</th>
                        <th>VIDEO</th>
                        <th>RECURSO</th>
                    </tr>
                </thead>
                <tbody id="tabla-temas">
                    </tbody>
            </table>
        </div>
    </main>

    <script>
        async function inicializarSitio() {
            try {
                const response = await fetch('temas.md');
                const texto = await response.text();
                const temas = procesarMarkdown(texto);
                renderizarTabla(temas);
            } catch (e) {
                console.error("Error al cargar temas.md", e);
            }
        }

        function procesarMarkdown(texto) {
            const lineas = texto.split('\n');
            const listaTemas = [];
            let currentTema = null;

            // Mapeo de meses para conversión de fecha
            const mesesMap = { "Jan": 0, "Feb": 1, "Mar": 2, "Apr": 3, "May": 4, "Jun": 5 };

            lineas.forEach(linea => {
                // Buscar Título del Tema
                if (linea.includes("Tema") && linea.includes(":")) {
                    const titulo = linea.split(':')[1].trim();
                    currentTema = { titulo: titulo };
                }
                // Buscar Fecha (Ej: 19 Mar)
                const matchFecha = linea.match(/(\d{2})\s(Jan|Feb|Mar|Apr|May|Jun)/);
                if (matchFecha && currentTema) {
                    currentTema.diaStr = matchFecha[0];
                    currentTema.fechaObj = new Date(2026, mesesMap[matchFecha[2]], parseInt(matchFecha[1]));
                    listaTemas.push({...currentTema});
                    currentTema = null;
                }
            });
            return listaTemas;
        }

        function renderizarTabla(temas) {
            const hoy = new Date();
            const tabla = document.getElementById('tabla-temas');
            
            // Definición de las carpetas según el orden
            const carpetas = [
                "Tema_01_Conceptos_Basicos", "Tema_02_Componentes_ANN", 
                "Tema_03_Entrenamiento_Basico", "Tema_04_Herramientas_Entornos",
                "Tema_05_Clasificacion_MLP", "Tema_06_Regresion_MLP", 
                "Tema_07_Evaluacion_Modelos", "Tema_08_Mejora_Practica"
            ];

            temas.forEach((tema, i) => {
                const esVisible = hoy >= tema.fechaObj;
                const folder = carpetas[i];
                const fila = document.createElement('tr');
                if (!esVisible) fila.classList.add('bloqueado');

                fila.innerHTML = `
                    <td>${tema.diaStr}</td>
                    <td>Tema ${i + 1}</td>
                    <td>${tema.titulo}</td>
                    <td>${esVisible ? `<a href="./${folder}/README.md" class="link-text">Ver Guía</a>` : 'No disponible'}</td>
                    <td>${esVisible ? `<a href="./${folder}/ANN_Practica.txt" target="_blank" class="link-code"><i class="fas fa-code"></i> Código</a>` : '-'}</td>
                    <td>${esVisible ? `<a href="#" onclick="gestionarVideo('./${folder}/grabacion_clase.url')" class="link-video"><i class="fas fa-video"></i> Video</a>` : '-'}</td>
                    <td>${esVisible ? `<a href="#" onclick="gestionarRecurso('./${folder}/image1.png')" class="link-text">Ver recurso</a>` : '-'}</td>
                `;
                tabla.appendChild(fila);
            });
        }

        function gestionarVideo(path) {
            fetch(path).then(r => r.text()).then(t => {
                const url = t.match(/URL=(.+)/);
                if (url) window.open(url[1].trim(), '_blank');
            }).catch(() => alert("El enlace del video no está disponible aún."));
        }

        function gestionarRecurso(path) {
            const img = new Image();
            img.onload = () => window.open(path, '_blank');
            img.onerror = () => alert("No hay recurso extra para este tema.");
            img.src = path;
        }

        window.onload = inicializarSitio;
    </script>
</body>
</html>
